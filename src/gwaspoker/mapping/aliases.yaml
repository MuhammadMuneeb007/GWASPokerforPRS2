  # ------------------------------------------------------------------
  # Alleles
  #
  # v1 listed a1/allele1/allele_1 in BOTH the effect and the alternative allele
  # lists, so is_string_in_list() reported the same column as both. Resolved
  # here in favour of the dominant PLINK/METAL convention: A1 is the effect
  # allele, A2/A0 the other allele.
  #
  # That convention is near-universal in PRS-facing tooling (PLINK, METAL, LDSC
  # and PRSice all read A1 as the effect allele), so A1/A2 keep full alias
  # confidence. ALT/REF do not: they are VCF coordinate conventions and are
  # mapped to their own `alternate_allele` / `reference_allele` concepts.
  # ------------------------------------------------------------------

  effect_allele:
    description: >-
      Allele to which the reported effect size applies. Getting this wrong flips
      the sign of every weight in a polygenic score.
    prs_tool_symbol: A1
    category: allele
    aliases:
      - effect_allele
      - effect_allel
      - eff_allele
      - effectallele
      - effect_allele_all
      - effect_allele_plink
      - effect_allele_saige
      - a1
      - a_1
      - allele1
      - allele_1
      - allelea
      - a1_allele
      - ea
      - coded_allele
      - coded_all
      - inc_allele
      - increaser_allele
      - risk_allele
      - tested_allele
      - test_allele
      - t_allele
      - hm_effect_allele
      - allele_effect

  other_allele:
    description: >-
      Non-effect (reference) allele. Required to orient the effect allele
      unambiguously against a reference panel.
    prs_tool_symbol: A2
    category: allele
    aliases:
      - other_allele
      - other_all
      - otherallele
      - non_effect_allele
      - noneffect_allele
      - noneff_allele
      - non_effect_allele_all
      - noncoded_allele
      - non_coded_allele
      - noneffectallele
      - a2
      - a_2
      - a0
      - allele2
      - allele_2
      - allele0
      - allele_0
      - alleleb
      - nea
      - dec_allele
      - decreaser_allele
      - baseline_allele
      - a2_other
      - hm_other_allele
      - major_allele
      - majorallele

  alternate_allele:
    description: >-
      The ALT allele of a VCF-style record. ALT is a *coordinate* convention --
      it is the non-reference allele at the site -- and says nothing about which
      allele the reported effect applies to. Many GWAS files do use ALT as the
      effect allele, but that is a per-source convention, not a rule, so
      GWASPoker maps ALT to its own concept and reports the ambiguity rather
      than asserting effect orientation. Confirm against the file's own
      documentation before using it as A1.
    prs_tool_symbol: ALT
    category: allele
    ambiguous: true
    ambiguity_note: >-
      ALT is the non-reference allele, not necessarily the effect allele.
      Confirm the effect orientation before treating this as A1.
    aliases:
      - alt
      - alt_allele
      - alternate_allele
      - alternative_allele

  reference_allele:
    description: >-
      The REF allele of a VCF-style record: the allele on the reference genome.
      Like ALT this is a coordinate convention, not a statement about effect
      orientation. Some sources additionally use "reference_allele" to mean the
      effect allele (LDSC's own alias table maps REFERENCE_ALLELE to A1), which
      is precisely why GWASPoker will not silently resolve it either way.
    prs_tool_symbol: REF
    category: allele
    ambiguous: true
    ambiguity_note: >-
      REF is the reference-genome allele, not necessarily the other allele.
      Sources disagree; confirm before treating this as A2.
    aliases:
      - ref
      - ref_allele
      - reference_allele

  # ------------------------------------------------------------------
