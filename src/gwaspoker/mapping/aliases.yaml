# Canonical GWAS column vocabulary for GWASPoker.
#
# THIS IS THE ONLY ALIAS RESOURCE IN THE PACKAGE. The original implementation
# maintained fourteen Python lists, duplicated verbatim across Module 2,
# Module 4 and Module 5, in which five aliases had been silently corrupted by
# missing commas between adjacent string literals. See docs/MIGRATION_NOTES.md
# section 4 for the full defect list and docs/MAPPING_SCHEMA.md for the schema.
#
# Structure
# ---------
#   version           schema version of this file
#   concepts:
#     <canonical_name>:
#       description     what the column means, scientifically
#       prs_tool_symbol short symbol used by PLINK/PRSice-style tools
#       category        identification | allele | effect | significance |
#                       frequency | sample | quality | meta
#       aliases         curated exact aliases (compared after normalization)
#
# Aliases are matched after normalization (lower-cased, punctuation folded to
# underscores, runs collapsed, edges trimmed) -- see mapping/normalize.py. So
# "P-Value", "p.value" and "P_VALUE" all reach the same entry, and only one form
# needs listing here.
#
# Rules for editing:
#   * an alias belongs to exactly one concept (enforced by tests);
#   * no alias may be a fragment that would match unrelated columns
#     ("e", "b", "base", "pair", "standard", "odds", "_value" were all removed);
#   * an alias that means something different from its concept does not belong
#     here, however common it is (p_bolt_lmm_inf is a p-value, not a beta).

version: 2

concepts:

  # ------------------------------------------------------------------
  # Variant identification
  # ------------------------------------------------------------------

  chromosome:
    description: Chromosome on which the variant lies.
    prs_tool_symbol: CHR
    category: identification
