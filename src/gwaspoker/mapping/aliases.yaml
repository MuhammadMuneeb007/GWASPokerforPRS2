# ----------------------------------------------------------------------
# Layer 3 heuristics.
#
# Applied only when Layers 1 and 2 find nothing. Each match reports
# mapping_method="heuristic" with a confidence below that of a curated alias,
# so a reviewer can see exactly which columns were guessed at.
# ----------------------------------------------------------------------

heuristics:
  suffix:
    # A trailing token that determines the concept. Covers the ~250
    # "<analyte>_pval" columns v1 enumerated one by one for a single
    # metabolomics resource.
    - suffix: _pval
      concept: p_value
      confidence: 0.72
    - suffix: _pvalue
      concept: p_value
      confidence: 0.72
    - suffix: _p_value
      concept: p_value
      confidence: 0.72
    - suffix: _beta
      concept: beta
      confidence: 0.68
    - suffix: _se
      concept: standard_error
      confidence: 0.68
    - suffix: _stderr
      concept: standard_error
      confidence: 0.7
    - suffix: _or
      concept: odds_ratio
      confidence: 0.6
    - suffix: _maf
      concept: minor_allele_frequency
      confidence: 0.68
    - suffix: _eaf
      concept: effect_allele_frequency
      confidence: 0.7
    - suffix: _zscore
      concept: z_score
      confidence: 0.7

  prefix:
    # Harmonised GWAS Catalog files prefix every standardized column with "hm_".
    - prefix: hm_
      strip: true
      confidence: 0.9

  contains:
    # Substring evidence, only for phrases with no competing reading.
    - contains: base_pair_location
      concept: position
      confidence: 0.8
    - contains: effect_allele_freq
      concept: effect_allele_frequency
      confidence: 0.8
    - contains: standard_error
      concept: standard_error
      confidence: 0.8
    - contains: odds_ratio
      concept: odds_ratio
      confidence: 0.78
    - contains: hazard_ratio
      concept: hazard_ratio
      confidence: 0.78
