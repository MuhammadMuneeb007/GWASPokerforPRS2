  variant_id:
    description: >-
      Variant identifier: an rsID, or a structured identifier such as
      "1_12345_A_G". Used to align variants against an LD reference panel.
    prs_tool_symbol: SNP
    category: identification
    ambiguous_aliases:
      # These are generic column names. They frequently do hold a variant
      # identifier, but the header alone is weak evidence -- "ID" is equally at
      # home holding a row number. They map here at reduced confidence, and the
      # value validator decides whether the data supports the claim.
      - id
      - name
      - marker
      - var_name
    aliases:
