# Cross-platform conda environment for GWASPoker v2.
#
#   conda env create -f environment.yml
#   conda activate gwaspoker
#   pip install -e .
#
# Unlike the v1 `environment.txt` (a `conda list --explicit` dump pinned to
# linux-64), this file resolves on Windows, Linux and macOS.
name: gwaspoker
channels:
  - conda-forge
dependencies:
  - python>=3.9
  - pip
  - requests>=2.28
  - pandas>=1.5
  - pyyaml>=6.0
  - charset-normalizer>=3.0
  - rich>=13.0
  - pytest>=7.4
  - pip:
      - typer>=0.9
      - responses>=0.24
      # Optional extras -- uncomment what you need:
      # - transformers>=4.30
      # - torch>=2.0
      # - gwaslab>=3.4
      # - openpyxl>=3.1
      # - rapidfuzz>=3.0
